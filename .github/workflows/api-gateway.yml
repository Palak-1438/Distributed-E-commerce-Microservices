name: API Gateway CI

on:
  push:
    paths:
      - 'api-gateway/**'
      - 'pom.xml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'pom.xml'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -pl api-gateway -am

    - name: Build Docker Image
      run: docker build -f api-gateway/Dockerfile -t ecommerce/api-gateway:${{ github.sha }} .
