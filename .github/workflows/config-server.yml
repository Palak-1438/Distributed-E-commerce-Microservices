name: Config Server CI

on:
  push:
    paths:
      - 'config-server/**'
      - 'pom.xml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'config-server/**'
      - 'pom.xml'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -pl config-server -am

    - name: Build Docker Image
      run: docker build -f config-server/Dockerfile -t ecommerce/config-server:${{ github.sha }} .
