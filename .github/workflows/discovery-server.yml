name: Discovery Server CI

on:
  push:
    paths:
      - 'eureka-discovery-server/**'
      - 'pom.xml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'eureka-discovery-server/**'
      - 'pom.xml'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -pl eureka-discovery-server -am

    - name: Build Docker Image
      run: |
        cd eureka-discovery-server
        docker build -t ecommerce/discovery-server:${{ github.sha }} .
