name: User Service CI

on:
  push:
    paths:
      - 'user-service/**'
      - 'pom.xml'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'user-service/**'
      - 'pom.xml'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -pl user-service -am -DskipTests

    - name: Build Docker Image
      run: docker build -f user-service/Dockerfile -t ecommerce/user-service:${{ github.sha }} .
