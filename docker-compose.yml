version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
      # Using root for development ease, in production use separate users
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network

  redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce-network

  discovery-server:
    build:
      context: .
      dockerfile: eureka-discovery-server/Dockerfile
    container_name: ecommerce-discovery-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: ecommerce-config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=config-server
      - EUREKA_SERVER_HOST=discovery-server
      - CONFIG_REPO_PATH=file:/config-repo/
    depends_on:
      - discovery-server
    volumes:
      - ./config-repo:/config-repo
    networks:
      - ecommerce-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - CONFIG_SERVER_HOST=config-server
    depends_on:
      - discovery-server
      - config-server
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce-auth-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=auth-service
      - CONFIG_SERVER_HOST=config-server
      - MYSQL_HOST=mysql
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
    depends_on:
      - discovery-server
      - config-server
      - mysql
    networks:
      - ecommerce-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: ecommerce-user-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=user-service
      - CONFIG_SERVER_HOST=config-server
      - MYSQL_HOST=mysql
    depends_on:
      - discovery-server
      - config-server
      - mysql
    networks:
      - ecommerce-network

volumes:
  mysql_data:
  redis_data:

networks:
  ecommerce-network:
    driver: bridge
