server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Use classpath to allow Docker execution without volume mapping complexities.
          # We'll map the config-repo to the classpath using Maven resources or externalize it directly.
          # For file path, we can use ${user.dir}/config-repo which works in root directory both locally and handles absolute paths better.
          search-locations: file:${user.dir}/config-repo/

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
